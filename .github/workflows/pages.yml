name: Legacy Pages deployment retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require a same-origin backend deployment
        run: |
          echo 'Standalone Pages relay publishing is retired. Use the existing Workers Builds or Aliyun main release with its matching SITE_EDITION artifact.' >&2
          exit 1
