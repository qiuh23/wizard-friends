name: Verify game
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'AGENTS.md', '.dev-memory.json']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'AGENTS.md', '.dev-memory.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - run: npm run worker:check
      - name: Cache browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Three-client smoke against the built local Durable Objects site
        run: |
          npm run dev:relay > /tmp/wizard-worker.log 2>&1 &
          trap 'cat /tmp/wizard-worker.log' EXIT
          for attempt in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health > /dev/null
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8787/ > /dev/null
          GAME_URL=http://127.0.0.1:8787/ BROWSER_CHANNEL=chromium npm run test:smoke
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: output/playwright/
          retention-days: 7
      - name: Save verified frontend for optional manual Pages deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend
          path: dist/
          retention-days: 7
      - name: Package the same checked frontend and Node backend for Aliyun
        if: github.ref == 'refs/heads/main'
        run: bash scripts/deploy/package.sh "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/wizard-aliyun"
      - name: Save the exact main Linux release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-${{ github.sha }}
          path: ${{ runner.temp }}/wizard-aliyun/*
          retention-days: 1
