# Install in /etc/nginx/conf.d/ AFTER review. This file belongs to the http
# context. No URI/query, Authorization, Cookie, nickname or game state is logged.
log_format game_network escape=json '{"at":"$time_iso8601","sourceIp":"$remote_addr","sourcePort":"$remote_port","serverIp":"$server_addr","serverPort":"$server_port","host":"$server_name","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"connection":"$connection"}';
